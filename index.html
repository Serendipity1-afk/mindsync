<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindSync - Web3 Mint & Wallet Radar</title>
    <style>
        :root {
            --bg-color: #080d1a;
            --card-bg: #131c2e;
            --accent: #38bdf8;
            --accent-green: #10b981;
            --accent-purple: #c084fc;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #23324a;
            --danger: #ef4444;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 24px 14px; max-width: 900px; margin: 0 auto; line-height: 1.5; }
        header { margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 16px; display: flex; justify-content: space-between; align-items: center; }
        h1 { font-size: 1.35rem; color: var(--accent); display: flex; align-items: center; gap: 8px; }
        .section { background: var(--card-bg); padding: 20px; border-radius: 12px; margin-bottom: 20px; border: 1px solid var(--border); }
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
        h2 { font-size: 1.1rem; font-weight: 600; }
        .grid-inputs { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; margin-bottom: 12px; }
        input, select, textarea { background: #070b14; border: 1px solid var(--border); color: white; padding: 10px 12px; border-radius: 8px; font-size: 0.9rem; width: 100%; }
        button { background: var(--accent); color: #080d1a; border: none; padding: 10px 16px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: 0.2s ease; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
        button:hover { opacity: 0.9; }
        button.green-btn { background: var(--accent-green); color: #fff; }
        button.purple-btn { background: var(--accent-purple); color: #080d1a; font-weight: bold; }
        button.danger-btn { background: transparent; color: var(--danger); border: 1px solid var(--danger); padding: 4px 8px; font-size: 0.75rem; border-radius: 6px; }
        button.danger-btn:hover { background: var(--danger); color: #fff; }
        button.mic-btn { background: #1e293b; color: white; padding: 10px 14px; font-size: 1.1rem; border-radius: 8px; }
        button.mic-btn.active { background: var(--danger); animation: pulse 1.2s infinite; }
        .voice-bar { display: flex; gap: 10px; align-items: center; background: #0b1322; padding: 12px; border-radius: 8px; border: 1px dashed var(--accent); margin-bottom: 16px; }
        .mint-list { display: flex; flex-direction: column; gap: 12px; list-style: none; }
        .mint-card { background: #0a1120; padding: 16px; border-radius: 10px; border-left: 5px solid var(--accent); display: flex; flex-direction: column; gap: 10px; border-top: 1px solid var(--border); border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); }
        .mint-card.gtd { border-left-color: var(--accent-green); }
        .mint-card.fcfs { border-left-color: var(--accent-purple); }
        .mint-top { display: flex; justify-content: space-between; align-items: center; font-size: 1.05rem; font-weight: bold; }
        .mint-badges { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
        .badge { background: #152238; padding: 4px 10px; border-radius: 6px; font-size: 0.8rem; border: 1px solid var(--border); color: var(--text-muted); }
        .badge.highlight { color: #38bdf8; border-color: #38bdf8; }
        .badge.gtd-badge { color: var(--accent-green); border-color: var(--accent-green); }
        .badge.fcfs-badge { color: var(--accent-purple); border-color: var(--accent-purple); }
        .wallet-box { background: #070b14; padding: 10px; border-radius: 6px; font-family: monospace; font-size: 0.82rem; color: #a5f3fc; border: 1px solid #1a2942; word-break: break-all; }
        .summary-box { background: #070b14; border: 1px solid var(--border); padding: 16px; border-radius: 8px; font-family: monospace; white-space: pre-wrap; font-size: 0.88rem; margin-top: 12px; display: none; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    </style>
</head>
<body>

    <header>
        <h1>⚡ MindSync: Web3 Mint Radar</h1>
        <button onclick="clearAllMints()" class="danger-btn">Reset All Mints</button>
    </header>

    <!-- VOICE COMMAND ASSISTANT BAR -->
    <div class="voice-bar">
        <button class="mic-btn" id="voiceAssistantMic" onclick="toggleVoiceAssistant()">🎙️</button>
        <input type="text" id="voiceCommandText" placeholder="Voice Assistant: Tap mic and say 'Got 3 GTD spots for Dino Gotchis at 0.05 ETH in 2 hours with Main Wallet'">
        <button onclick="parseSpokenAssistant()" class="purple-btn">Run</button>
    </div>

    <!-- MINT & WALLET ENTRY FORM -->
    <div class="section">
        <div class="section-header">
            <h2>➕ Add Upcoming Mint / Collab</h2>
        </div>
        <div class="grid-inputs">
            <input type="text" id="openseaLink" placeholder="OpenSea Link or Project Name" oninput="handleOpenSeaInput()">
            <select id="mintTier">
                <option value="GTD">GTD (Guaranteed WL)</option>
                <option value="FCFS">FCFS (First Come First Serve)</option>
                <option value="Public">Public Mint</option>
            </select>
            <input type="number" id="mintSpots" placeholder="Spots / Quantity" min="1" value="1">
            <input type="text" id="mintCost" placeholder="Price (e.g. Free, 0.05 ETH, 1.2 SOL)">
            <input type="datetime-local" id="mintDateTime">
        </div>
        <div style="margin-bottom: 12px;">
            <input type="text" id="eligibleWallets" placeholder="Eligible Wallets (e.g. Main: 0x66ba... | Vault: 0x12ab...)">
        </div>
        <button onclick="addMintManual()" class="green-btn" style="width: 100%;">Save Mint Radar Entry</button>
    </div>

    <!-- ACTIVE MINT RADAR -->
    <div class="section">
        <div class="section-header">
            <h2>🚨 Active Mint Radar & Wallet Allocation</h2>
            <span style="font-size: 0.8rem; color: var(--text-muted);">Sorted by upcoming launch (IST)</span>
        </div>
        <ul id="mintList" class="mint-list"></ul>
    </div>

    <!-- REPORT / SUMMARY EXPORT -->
    <div class="section">
        <div class="section-header">
            <h2>📊 Export Daily Wallet & Mint Sheet</h2>
        </div>
        <button onclick="compileMintSummary()" style="background:#1e293b; color:#fff;">Compile Wallet Schedule</button>
        <div id="summaryOutput" class="summary-box"></div>
    </div>

    <script>
        let mints = JSON.parse(localStorage.getItem('mindsync_web3_mints')) || [];
        let isAssistantRecording = false;
        let recognition = null;

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

        window.onload = function() {
            renderMints();
            setInterval(checkMintAlerts, 15000);

            if (Notification.permission !== "granted" && Notification.permission !== "denied") {
                Notification.requestPermission();
            }
        };

        // --- SPEECH SYNTHESIS HELPER ---
        function speak(text) {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.rate = 1.0;
            utterance.pitch = 1.0;
            utterance.lang = 'en-IN';
            window.speechSynthesis.speak(utterance);
        }

        // --- OPENSEA URL AUTO-EXTRACTOR ---
        function handleOpenSeaInput() {
            const input = document.getElementById('openseaLink').value.trim();
            if (input.includes('opensea.io/collection/')) {
                try {
                    const slug = input.split('opensea.io/collection/')[1].split('/')[0].split('?')[0];
                    const cleanName = slug.replace(/[-_]/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
                    document.getElementById('openseaLink').value = cleanName;
                } catch (e) {
                    console.log("Could not parse slug:", e);
                }
            }
        }

        // --- NATURAL LANGUAGE & VOICE PARSER ---
        function toggleVoiceAssistant() {
            if (!SpeechRecognition) {
                alert("Speech recognition not supported on this browser. Please use Chrome or Edge.");
                return;
            }

            if (isAssistantRecording) {
                recognition.stop();
                return;
            }

            recognition = new SpeechRecognition();
            recognition.lang = 'en-IN';
            recognition.interimResults = false;
            recognition.continuous = false;

            const micBtn = document.getElementById('voiceAssistantMic');
            const inputField = document.getElementById('voiceCommandText');

            recognition.onstart = function() {
                isAssistantRecording = true;
                micBtn.classList.add('active');
                inputField.placeholder = "Listening... Speak your mint, spots, price, and wallets...";
            };

            recognition.onerror = function(event) {
                isAssistantRecording = false;
                micBtn.classList.remove('active');
                console.error("Speech Error:", event.error);
            };

            recognition.onresult = function(event) {
                const transcript = event.results[0][0].transcript.trim();
                inputField.value = transcript;
                parseSpokenAssistant();
            };

            recognition.onend = function() {
                isAssistantRecording = false;
                micBtn.classList.remove('active');
                inputField.placeholder = "Voice Assistant: Tap mic and say 'Got 3 GTD spots for Dino Gotchis at 0.05 ETH in 2 hours with Main Wallet'";
            };

            recognition.start();
        }

        function parseSpokenAssistant() {
            const text = document.getElementById('voiceCommandText').value.trim();
            if (!text) return;

            let lower = text.toLowerCase();

            // 1. Parse Spots (e.g. "3 spots", "got 2 spots")
            const spotsMatch = lower.match(/(\d+)\s*(?:spots?|allocations?|wl)/i);
            if (spotsMatch) {
                document.getElementById('mintSpots').value = spotsMatch[1];
            }

            // 2. Parse Tier (GTD / FCFS / Public)
            if (lower.includes('gtd') || lower.includes('guaranteed')) {
                document.getElementById('mintTier').value = 'GTD';
            } else if (lower.includes('fcfs') || lower.includes('first come')) {
                document.getElementById('mintTier').value = 'FCFS';
            } else if (lower.includes('public')) {
                document.getElementById('mintTier').value = 'Public';
            }

            // 3. Parse Price (e.g. "0.05 eth", "free", "point 08 eth", "1.5 sol")
            lower = lower.replace(/\bpoint\s+(\d+)/g, '0.$1');
            const priceMatch = lower.match(/(free|\d+(?:\.\d+)?\s*(?:eth|sol|matic|usdt)?)/i);
            if (priceMatch) {
                document.getElementById('mintCost').value = priceMatch[0].toUpperCase();
            }

            // 4. Parse Relative Time (e.g. "in 2 hours", "in 30 minutes")
            const timeMatch = lower.match(/\bin\s+(\d+)\s*(hours?|hrs?|minutes?|mins?)/i);
            if (timeMatch) {
                const qty = parseInt(timeMatch[1], 10);
                const isHours = timeMatch[2].startsWith('h');
                const future = new Date();
                if (isHours) future.setHours(future.getHours() + qty);
                else future.setMinutes(future.getMinutes() + qty);

                // Format for datetime-local (YYYY-MM-DDTHH:MM)
                const yr = future.getFullYear();
                const mo = String(future.getMonth() + 1).padStart(2, '0');
                const da = String(future.getDate()).padStart(2, '0');
                const hr = String(future.getHours()).padStart(2, '0');
                const mi = String(future.getMinutes()).padStart(2, '0');
                document.getElementById('mintDateTime').value = `${yr}-${mo}-${da}T${hr}:${mi}`;
            }

            // 5. Extract Project Name
            let cleanProject = text
                .replace(/\b(got|have|add|set|mint|spots?|gtd|fcfs|guaranteed|first come|at|for|in|\d+|hours?|mins?|eth|sol|free|with wallet.*)\b/gi, '')
                .replace(/\s+/g, ' ')
                .trim();

            if (cleanProject) {
                document.getElementById('openseaLink').value = cleanProject;
            }

            // 6. Extract Wallet info
            const walletMatch = text.match(/with wallet\s*(.*)/i);
            if (walletMatch) {
                document.getElementById('eligibleWallets').value = walletMatch[1].trim();
            }

            speak("Mint details extracted. Confirm and click save.");
        }

        // --- MINT DATA STORAGE ---
        function addMintManual() {
            const project = document.getElementById('openseaLink').value.trim();
            const tier = document.getElementById('mintTier').value;
            const spots = document.getElementById('mintSpots').value || '1';
            const cost = document.getElementById('mintCost').value.trim() || 'TBA';
            const dateTime = document.getElementById('mintDateTime').value;
            const wallets = document.getElementById('eligibleWallets').value.trim() || 'Not Assigned';

            if (!project || !dateTime) {
                alert("Please specify the Project Name and Mint Launch Date/Time!");
                return;
            }

            mints.push({
                id: Date.now(),
                project,
                tier,
                spots,
                cost,
                dateTime,
                wallets,
                status: 'Upcoming',
                notified: false
            });

            mints.sort((a, b) => new Date(a.dateTime) - new Date(b.dateTime));
            localStorage.setItem('mindsync_web3_mints', JSON.stringify(mints));

            // Reset inputs
            document.getElementById('openseaLink').value = '';
            document.getElementById('mintCost').value = '';
            document.getElementById('mintDateTime').value = '';
            document.getElementById('eligibleWallets').value = '';
            document.getElementById('voiceCommandText').value = '';

            renderMints();
            speak(`Saved ${project} with ${spots} spots.`);
        }

        function renderMints() {
            const list = document.getElementById('mintList');
            list.innerHTML = mints.length === 0 ? `<li style="color: var(--text-muted); font-size: 0.85rem;">No active mints tracked. Add one above.</li>` : '';

            mints.forEach(m => {
                const dateObj = new Date(m.dateTime);
                const istString = dateObj.toLocaleString('en-IN', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
                const isGTD = m.tier === 'GTD';

                list.innerHTML += `
                    <li class="mint-card ${isGTD ? 'gtd' : 'fcfs'}">
                        <div class="mint-top">
                            <span>${m.project}</span>
                            <button class="danger-btn" onclick="deleteMint(${m.id})">Delete</button>
                        </div>
                        <div class="mint-badges">
                            <span class="badge ${isGTD ? 'gtd-badge' : 'fcfs-badge'}">${m.tier}</span>
                            <span class="badge highlight">🎯 Spots: ${m.spots}</span>
                            <span class="badge">💰 Cost: ${m.cost}</span>
                            <span class="badge">⏰ ${istString} IST</span>
                            <span class="badge" style="cursor:pointer;" onclick="toggleMintStatus(${m.id})">Status: ${m.status} 🔁</span>
                        </div>
                        <div class="wallet-box">
                            <strong>🔑 Eligible Wallets:</strong> ${m.wallets}
                        </div>
                    </li>
                `;
            });
        }

        function toggleMintStatus(id) {
            const item = mints.find(m => m.id === id);
            if (!item) return;
            const statuses = ['Upcoming', 'Whitelisted', 'Live Now', 'Minted', 'Passed'];
            const nextIdx = (statuses.indexOf(item.status) + 1) % statuses.length;
            item.status = statuses[nextIdx];
            localStorage.setItem('mindsync_web3_mints', JSON.stringify(mints));
            renderMints();
        }

        function deleteMint(id) {
            mints = mints.filter(m => m.id !== id);
            localStorage.setItem('mindsync_web3_mints', JSON.stringify(mints));
            renderMints();
        }

        // --- BACKGROUND NOTIFICATIONS & AUDIO ALARMS ---
        function checkMintAlerts() {
            const now = new Date().getTime();
            mints.forEach(m => {
                const targetTime = new Date(m.dateTime).getTime();
                const diffMins = Math.round((targetTime - now) / 60000);

                if (diffMins <= 15 && diffMins >= 0 && !m.notified) {
                    m.notified = true;
                    localStorage.setItem('mindsync_web3_mints', JSON.stringify(mints));

                    speak(`Attention: ${m.project} mints in ${diffMins} minutes. Ready your wallets.`);

                    if (Notification.permission === "granted") {
                        new Notification(`🚨 MINT ALERT: ${m.project}`, {
                            body: `${m.tier} (${m.spots} Spots) @ ${m.cost}\nWallets: ${m.wallets}`,
                            requireInteraction: true
                        });
                    }
                }
            });
        }

        // --- EXPORT MASTER SUMMARY ---
        function compileMintSummary() {
            const out = document.getElementById('summaryOutput');
            let text = `⚡ MINDSYNC MINT & WALLET MASTER SHEET\n`;
            text += `Generated: ${new Date().toLocaleString('en-IN')} IST\n`;
            text += `=========================================================\n\n`;

            if (mints.length === 0) text += `No mint allocations scheduled.\n`;
            mints.forEach(m => {
                const dateObj = new Date(m.dateTime);
                const istStr = dateObj.toLocaleString('en-IN', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
                text += `• [${m.tier}] ${m.project}\n`;
                text += `   - Spots: ${m.spots} | Price: ${m.cost}\n`;
                text += `   - Launch: ${istStr} IST\n`;
                text += `   - Eligible Wallets: ${m.wallets}\n`;
                text += `   - Status: ${m.status}\n\n`;
            });

            out.innerText = text;
            out.style.display = 'block';
        }

        function clearAllMints() {
            if (confirm("Reset all tracked mints and wallet data?")) {
                mints = [];
                localStorage.removeItem('mindsync_web3_mints');
                renderMints();
                document.getElementById('summaryOutput').style.display = 'none';
            }
        }
    </script>
</body>
</html>
