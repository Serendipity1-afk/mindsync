<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindSync - External Brain</title>
    <style>
        :root {
            --bg-color: #0b1120;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --accent-green: #10b981;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --danger: #ef4444;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 24px 16px; max-width: 760px; margin: 0 auto; line-height: 1.5; }
        header { margin-bottom: 24px; border-bottom: 1px solid var(--border); padding-bottom: 16px; display: flex; justify-content: space-between; align-items: center; }
        h1 { font-size: 1.4rem; color: var(--accent); display: flex; align-items: center; gap: 8px; }
        .section { background: var(--card-bg); padding: 20px; border-radius: 12px; margin-bottom: 20px; border: 1px solid var(--border); }
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        h2 { font-size: 1.05rem; font-weight: 600; }
        .input-row { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
        input[type="text"] { background: #070d19; border: 1px solid var(--border); color: white; padding: 10px 14px; border-radius: 8px; flex: 2; min-width: 200px; font-size: 0.95rem; }
        input[type="time"] { background: #070d19; border: 1px solid var(--border); color: white; padding: 10px; border-radius: 8px; font-size: 0.95rem; }
        button { background: var(--accent); color: #070d19; border: none; padding: 10px 16px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: 0.2s ease; display: inline-flex; align-items: center; gap: 6px; }
        button:hover { opacity: 0.9; }
        button.green-btn { background: var(--accent-green); color: #fff; }
        button.danger-btn { background: transparent; color: var(--danger); border: 1px solid var(--danger); padding: 4px 8px; font-size: 0.8rem; }
        button.danger-btn:hover { background: var(--danger); color: #fff; }
        button.preset-btn { background: #334155; color: #f8fafc; padding: 6px 12px; font-size: 0.8rem; font-weight: normal; border-radius: 6px; }
        button.preset-btn:hover { background: #475569; }
        button.mic-btn { background: #334155; color: white; padding: 10px 14px; font-size: 1.1rem; border-radius: 8px; }
        button.mic-btn.active { background: var(--danger); animation: pulse 1.2s infinite; }
        .presets { display: flex; gap: 6px; margin-bottom: 12px; align-items: center; font-size: 0.85rem; color: var(--text-muted); }
        .item-list { list-style: none; display: flex; flex-direction: column; gap: 8px; }
        .item { display: flex; justify-content: space-between; align-items: center; background: #0e1726; padding: 12px 14px; border-radius: 8px; border-left: 4px solid var(--accent); font-size: 0.95rem; }
        .item.log-item { border-left-color: var(--accent-green); }
        .item-text { flex: 1; margin-right: 12px; word-break: break-word; }
        .summary-box { background: #070d19; border: 1px solid var(--border); padding: 16px; border-radius: 8px; font-family: monospace; white-space: pre-wrap; font-size: 0.88rem; margin-top: 12px; display: none; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    </style>
</head>
<body>

    <header>
        <h1>🧠 MindSync</h1>
        <button onclick="clearAllData()" class="danger-btn">Reset All Data</button>
    </header>

    <!-- SECTION 1: TASK & REMINDER SCHEDULER -->
    <div class="section">
        <div class="section-header">
            <h2>📅 Schedule Alarm / Task</h2>
        </div>
        <div class="presets">
            <span>Quick set:</span>
            <button class="preset-btn" onclick="setPresetOffset(15)">+15 min</button>
            <button class="preset-btn" onclick="setPresetOffset(30)">+30 min</button>
            <button class="preset-btn" onclick="setPresetOffset(60)">+1 hr</button>
        </div>
        <div class="input-row">
            <button class="mic-btn" id="taskMic" onclick="toggleVoice('task')">🎙️</button>
            <input type="text" id="taskTitle" placeholder="Task name (or tap mic and speak)">
            <input type="time" id="taskTime">
            <button onclick="saveTaskManual()">Add Task</button>
        </div>
        <ul id="scheduleList" class="item-list"></ul>
    </div>

    <!-- SECTION 2: INSTANT ACTIVITY LOGGER -->
    <div class="section">
        <div class="section-header">
            <h2>⏱️ Current Activity Log</h2>
            <span style="font-size:0.8rem; color:var(--text-muted);">Auto-timestamps in IST</span>
        </div>
        <div class="input-row">
            <button class="mic-btn" id="logMic" onclick="toggleVoice('log')">🎙️</button>
            <input type="text" id="logActivity" placeholder="What are you working on right now?">
            <button class="green-btn" onclick="saveLogManual()">Log Entry</button>
        </div>
        <ul id="logList" class="item-list"></ul>
    </div>

    <!-- SECTION 3: DAILY SUMMARY -->
    <div class="section">
        <div class="section-header">
            <h2>📊 Daily Timeline & Summary</h2>
        </div>
        <button onclick="compileSummary()" style="background:#334155; color:#fff;">Generate Summary</button>
        <div id="summaryOutput" class="summary-box"></div>
    </div>

    <script>
        let tasks = JSON.parse(localStorage.getItem('mindsync_tasks')) || [];
        let logs = JSON.parse(localStorage.getItem('mindsync_logs')) || [];
        let recognition = null;
        let isRecording = false;

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

        window.onload = function() {
            renderTasks();
            renderLogs();
            setInterval(checkAlarms, 15000);

            if (Notification.permission !== "granted" && Notification.permission !== "denied") {
                Notification.requestPermission();
            }
        };

        // --- PRESET TIME SHORTCUTS ---
        function setPresetOffset(minutes) {
            const now = new Date();
            now.setMinutes(now.getMinutes() + minutes);
            const timeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
            document.getElementById('taskTime').value = timeStr;
        }

        // --- TIME FORMATTING HELPER (IST) ---
        function getCurrentISTTime() {
            const now = new Date();
            return `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
        }

        // --- SINGLE-TRIGGER VOICE ENGINE ---
        function toggleVoice(type) {
            if (!SpeechRecognition) {
                alert("Speech recognition not supported on this browser. Please use Chrome or Edge.");
                return;
            }

            if (isRecording) {
                recognition.stop();
                return;
            }

            recognition = new SpeechRecognition();
            recognition.lang = 'en-IN';
            recognition.interimResults = false;
            recognition.continuous = false;

            const micBtn = document.getElementById(type === 'task' ? 'taskMic' : 'logMic');
            const inputField = document.getElementById(type === 'task' ? 'taskTitle' : 'logActivity');

            recognition.onstart = function() {
                isRecording = true;
                micBtn.classList.add('active');
                inputField.placeholder = "Listening... Speak once...";
            };

            recognition.onerror = function(event) {
                isRecording = false;
                micBtn.classList.remove('active');
                console.error("Speech Error:", event.error);
            };

            recognition.onresult = function(event) {
                const transcript = event.results[0][0].transcript.trim();
                if (!transcript) return;

                if (type === 'task') {
                    parseAndSetTask(transcript);
                } else {
                    inputField.value = transcript;
                }
            };

            recognition.onend = function() {
                isRecording = false;
                micBtn.classList.remove('active');
                inputField.placeholder = type === 'task' ? "Task name (or tap mic and speak)" : "What are you working on right now?";
            };

            recognition.start();
        }

        function parseAndSetTask(transcript) {
            // Check for explicit "at <time>"
            const timeMatch = transcript.match(/\b(?:at\s+)?(\d{1,2})(?::(\d{2}))?\s*(am|pm)?\b/i);
            let cleanedTitle = transcript;

            if (timeMatch && timeMatch[1]) {
                let hours = parseInt(timeMatch[1], 10);
                let minutes = timeMatch[2] ? parseInt(timeMatch[2], 10) : 0;
                const period = timeMatch[3] ? timeMatch[3].toLowerCase() : null;

                if (period === 'pm' && hours < 12) hours += 12;
                if (period === 'am' && hours === 12) hours = 0;

                const timeStr = `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}`;
                document.getElementById('taskTime').value = timeStr;
                cleanedTitle = transcript.replace(timeMatch[0], '').trim();
            }

            document.getElementById('taskTitle').value = cleanedTitle || transcript;
        }

        // --- TASK HANDLERS ---
        function saveTaskManual() {
            const title = document.getElementById('taskTitle').value.trim();
            const time = document.getElementById('taskTime').value;

            if (!title || !time) {
                alert("Please add both a task description and a target time.");
                return;
            }

            tasks.push({ id: Date.now(), title, time, notified: false });
            tasks.sort((a, b) => a.time.localeCompare(b.time));
            localStorage.setItem('mindsync_tasks', JSON.stringify(tasks));

            document.getElementById('taskTitle').value = '';
            document.getElementById('taskTime').value = '';
            renderTasks();
        }

        function renderTasks() {
            const list = document.getElementById('scheduleList');
            list.innerHTML = tasks.length === 0 ? `<li style="color: var(--text-muted); font-size: 0.9rem;">No alarms scheduled.</li>` : '';
            tasks.forEach(t => {
                list.innerHTML += `
                    <li class="item">
                        <span class="item-text"><strong>[${t.time}]</strong> ${t.title}</span>
                        <button class="danger-btn" onclick="deleteTask(${t.id})">Delete</button>
                    </li>`;
            });
        }

        function deleteTask(id) {
            tasks = tasks.filter(t => t.id !== id);
            localStorage.setItem('mindsync_tasks', JSON.stringify(tasks));
            renderTasks();
        }

        function checkAlarms() {
            const currentHourMin = getCurrentISTTime();
            tasks.forEach(t => {
                if (t.time === currentHourMin && !t.notified) {
                    t.notified = true;
                    localStorage.setItem('mindsync_tasks', JSON.stringify(tasks));
                    if (Notification.permission === "granted") {
                        new Notification("🚨 TASK DUE NOW", { body: t.title });
                    } else {
                        alert(`🚨 ALARM: ${t.title}`);
                    }
                }
            });
        }

        // --- LOG HANDLERS ---
        function saveLogManual() {
            const text = document.getElementById('logActivity').value.trim();
            if (!text) return;

            const time = getCurrentISTTime();
            logs.unshift({ id: Date.now(), text, time });
            localStorage.setItem('mindsync_logs', JSON.stringify(logs));

            document.getElementById('logActivity').value = '';
            renderLogs();
        }

        function renderLogs() {
            const list = document.getElementById('logList');
            list.innerHTML = logs.length === 0 ? `<li style="color: var(--text-muted); font-size: 0.9rem;">No logs recorded today.</li>` : '';
            logs.forEach(l => {
                list.innerHTML += `
                    <li class="item log-item">
                        <span class="item-text"><strong>[${l.time}]</strong> ${l.text}</span>
                        <button class="danger-btn" onclick="deleteLog(${l.id})">Delete</button>
                    </li>`;
            });
        }

        function deleteLog(id) {
            logs = logs.filter(l => l.id !== id);
            localStorage.setItem('mindsync_logs', JSON.stringify(logs));
            renderLogs();
        }

        // --- SUMMARY & RESET ---
        function compileSummary() {
            const out = document.getElementById('summaryOutput');
            let text = `🧠 MINDSYNC REPORT - ${new Date().toLocaleDateString()}\n`;
            text += `==========================================\n\n`;

            text += `📅 SCHEDULED ALARMS:\n`;
            if (tasks.length === 0) text += `  • None\n`;
            tasks.forEach(t => text += `  • [${t.time}] ${t.title}\n`);

            text += `\n⏱️ ACTIVITY TIMELINE:\n`;
            if (logs.length === 0) text += `  • None\n`;
            [...logs].reverse().forEach(l => text += `  • [${l.time}] ${l.text}\n`);

            out.innerText = text;
            out.style.display = 'block';
        }

        function clearAllData() {
            if (confirm("Clear all scheduled tasks and logs?")) {
                tasks = [];
                logs = [];
                localStorage.removeItem('mindsync_tasks');
                localStorage.removeItem('mindsync_logs');
                renderTasks();
                renderLogs();
                document.getElementById('summaryOutput').style.display = 'none';
            }
        }
    </script>
</body>
</html>
